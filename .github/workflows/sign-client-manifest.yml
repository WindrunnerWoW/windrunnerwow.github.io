name: Sign client manifest

on:
  push:
    branches: [main]
    paths: [client.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sign-client-manifest
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sign client.json
        env:
          CLIENT_MANIFEST_PRIVATE_KEY: ${{ secrets.CLIENT_MANIFEST_PRIVATE_KEY }}
        run: node scripts/sign-client-manifest.mjs
      - name: Commit manifest if changed
        id: commit
        run: |
          git add -- client.manifest.json static/client.manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sign client manifest"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish signed manifest
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
